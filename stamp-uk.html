<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>超民のイギリススタンプ旅</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a stamp-rally booklet. Big playful map on the left (prefectures filled like collected stamps, map-symbol pins), the "page" for the chosen place on the right, and the 47-stamp card underneath. Stacks on phone. */
:root{
  --bg:#eaf3ef; --paper:#fffdf8; --ink:#1e2b33; --muted:#5f6f76; --line:#cfdcd7;
  --land:#f7f3ea; --land-line:#c9d3cf; --sea:#d6ebe6;
  --v1:#ffd66b; --v2:#ffab5c; --v3:#f2705a; --v4:#c8476d;
  --accent:#283593; --pin:#1e2b33; --pin-ink:#fffdf8; --good:#2f8f6a;
  --font-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --font-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --font-mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101a20; --paper:#17242b; --ink:#eef3f1; --muted:#9cb0b5; --line:#2a3b43;
  --land:#22323a; --land-line:#34474f; --sea:#13222a;
  --v1:#c9a43e; --v2:#d9813c; --v3:#e0634f; --v4:#d0577c;
  --accent:#283593; --pin:#eef3f1; --pin-ink:#101a20; --good:#56c39a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101a20; --paper:#17242b; --ink:#eef3f1; --muted:#9cb0b5; --line:#2a3b43;
  --land:#22323a; --land-line:#34474f; --sea:#13222a;
  --v1:#c9a43e; --v2:#d9813c; --v3:#e0634f; --v4:#d0577c;
  --accent:#283593; --pin:#eef3f1; --pin-ink:#101a20; --good:#56c39a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.kicker{font:500 12px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font:400 clamp(28px,5.4vw,46px)/1.05 var(--font-display);letter-spacing:.02em;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.tally{display:flex;gap:10px;flex-wrap:wrap}
.tal{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:6px 14px;box-shadow:3px 3px 0 var(--ink);min-width:86px}
.tal b{display:block;font:400 26px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.tal span{font-size:12px;color:var(--muted)}
.tal.hl b{color:var(--accent)}
.back{font:500 13px var(--font-body);color:var(--ink);text-decoration:none;border-bottom:2px solid var(--accent)}
.main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.mapbox{position:relative;background:var(--sea);border:2px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:5px 5px 0 var(--ink);
  background-image:radial-gradient(color-mix(in oklab,var(--ink) 9%,transparent) 1px,transparent 1.2px);background-size:18px 18px}
#map{display:block;width:100%;height:auto;aspect-ratio:800/600;max-width:100%;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.pref{fill:var(--land);stroke:var(--land-line);stroke-width:.7;vector-effect:non-scaling-stroke;transition:fill .25s}
.pref.v1{fill:var(--v1)}.pref.v2{fill:var(--v2)}.pref.v3{fill:var(--v3)}.pref.v4{fill:var(--v4)}
.pref.visited{cursor:pointer}
.pref.visited:hover{filter:brightness(1.07)}
.pref.sel{stroke:var(--ink);stroke-width:2.2}
.inset{fill:none;stroke:var(--muted);stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
.inset-t{font:500 10px var(--font-mono);fill:var(--muted)}
.pin{cursor:pointer}
.pin circle{fill:var(--pin);stroke:var(--paper);stroke-width:1.6;vector-effect:non-scaling-stroke}
.pin text{fill:var(--pin-ink);font:700 11px var(--font-body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin.on circle{fill:var(--accent)}
.pin .bob{transform-box:fill-box;transform-origin:center bottom;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.pin:hover .bob{animation:wob .5s ease}
@keyframes pop{from{transform:scale(0) translateY(6px)}to{transform:none}}
@keyframes wob{30%{transform:translateY(-4px) rotate(-8deg)}60%{transform:translateY(-2px) rotate(6deg)}}
.tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.tools button,.chip,.dice{font:700 14px var(--font-body);color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:12px;cursor:pointer}
.tools button{width:36px;height:36px}
.legend{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:4px 10px;font-size:11px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--land-line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-weight:500;font-size:13px;padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.chip .g{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pin);color:var(--pin-ink);font-size:11px}
.chip[aria-pressed="false"]{opacity:.45;border-style:dashed}
button:focus-visible,a:focus-visible,.pref:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.side{display:grid;gap:14px;min-width:0}
.page{background:var(--paper);border:2px solid var(--ink);border-radius:22px;padding:18px 18px 16px;box-shadow:5px 5px 0 var(--ink);display:grid;gap:10px;position:relative;overflow:hidden;min-width:0}
.page h2{margin:0;font:400 30px/1.1 var(--font-display);padding-right:96px;text-wrap:balance}
.page .sub{font:500 12px var(--font-mono);color:var(--muted);letter-spacing:.06em}
.seal{position:absolute;right:14px;top:12px;width:84px;height:84px;border-radius:50%;border:3px solid var(--accent);color:var(--accent);
  display:grid;place-items:center;text-align:center;transform:rotate(-12deg);font:400 15px/1.15 var(--font-display);padding:6px}
.seal small{display:block;font:500 9px var(--font-mono);letter-spacing:.08em}
.seal.stamp{animation:thunk .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes thunk{from{transform:rotate(-12deg) scale(1.9);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.spots{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:430px;overflow-y:auto}
.spot{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:8px 10px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;background:transparent;text-align:left;color:inherit;font:inherit;width:100%}
.spot:hover{border-color:var(--ink)}
.spot.on{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 9%,transparent)}
.spot .g{width:30px;height:30px;border-radius:50%;background:var(--pin);color:var(--pin-ink);display:grid;place-items:center;font-weight:700;font-size:14px}
.spot b{font-size:15px}
.spot .d{font:500 12px var(--font-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.spot p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.spot.pending{cursor:default;border-style:dashed}
.spot.pending .g{background:transparent;color:var(--muted);border:1.5px dashed var(--muted)}
.dice{padding:8px 12px;justify-self:start;box-shadow:3px 3px 0 var(--ink)}
.dice:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.next{font-size:14px;min-height:1.6em}
.next b{color:var(--accent)}
.book{background:var(--paper);border:2px solid var(--ink);border-radius:22px;padding:16px 18px;box-shadow:5px 5px 0 var(--ink);display:grid;gap:12px}
.book h3{margin:0;font:400 20px var(--font-display);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.book h3 span{font:500 13px var(--font-mono);color:var(--muted)}
.regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px 18px}
.reg{display:grid;gap:6px}
.reg h4{margin:0;font:700 12px var(--font-body);color:var(--muted);letter-spacing:.08em}
.stamps{display:flex;flex-wrap:wrap;gap:6px}
.st{width:46px;height:46px;border-radius:50%;border:1.5px dashed var(--land-line);display:grid;place-items:center;font:700 12px/1.1 var(--font-body);color:var(--muted);background:transparent;cursor:default;padding:0}
.st.got{border:2.5px solid var(--accent);color:var(--accent);transform:rotate(var(--r,-8deg));cursor:pointer;background:color-mix(in oklab,var(--accent) 7%,transparent)}
.st.got:hover{transform:rotate(0) scale(1.08)}
.st.sel{background:var(--accent);color:var(--paper)}
.foot{font-size:12px;color:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font:500 12px var(--font-body);padding:4px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-140%)}
@media (max-width:860px){.main{grid-template-columns:1fr}.spots{max-height:none}}
@media (max-width:520px){.tally{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}.tal{min-width:0;padding:6px 8px}.tal b{font-size:21px}.tal span{font-size:10px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.pref.other{pointer-events:none}
.st{width:46px;height:46px;overflow:hidden;text-align:center;word-break:break-all;padding:2px;line-height:1.08}
.seal{overflow:hidden}
.stamps{align-content:flex-start}
.reg{align-content:start}
</style>
<div class="wrap" lang="ja">
  <header>
    <div>
      <div class="kicker">United Kingdom Stamp Rally · 2015</div>
      <h1>超民の<em>イギリス</em>スタンプ旅</h1>
      <a class="back" href="archipelago.html" target="_blank" rel="noopener">← 旅の群島（世界）へ戻る</a>
    </div>
    <div class="tally">
      <div class="tal hl"><b id="tPref">0</b><span>/ 16 地域</span></div>
      <div class="tal"><b id="tSpot">0</b><span>スポット</span></div>
      <div class="tal"><b id="tYear">0</b><span>訪問年</span></div>
      <div class="tal"><b id="tTrip">0</b><span>旅の回数</span></div>
    </div>
  </header>
  <div class="chips" id="chips" role="group" aria-label="カテゴリで絞り込む"></div>
  <div class="main">
    <div class="mapbox">
      <svg id="map" viewBox="0 0 800 600" role="img" aria-label="訪れた行政区とスポットの地図"></svg>
      <div class="tools">
        <button type="button" id="zin" aria-label="拡大">＋</button>
        <button type="button" id="zout" aria-label="縮小">－</button>
        <button type="button" id="zreset" aria-label="全体を表示">◎</button>
      </div>
      <div class="legend" aria-hidden="true">訪問回数 <i style="background:var(--land)"></i>0 <i style="background:var(--v1)"></i>1 <i style="background:var(--v2)"></i>2 <i style="background:var(--v3)"></i>3–5 <i style="background:var(--v4)"></i>6+</div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="side">
      <section class="page" id="page" aria-live="polite">
        <div class="seal" id="seal"></div>
        <div class="sub" id="pSub"></div>
        <h2 id="pName"></h2>
        <ul class="spots" id="pSpots"></ul>
      </section>
      <button class="dice" id="dice" type="button">サイコロで次の旅先を決める</button>
      <div class="next" id="next">まだ押していないスタンプから、次の旅先をくじ引きします。</div>
    </div>
  </div>
  <section class="book">
    <h3>スタンプ帳 <span id="bookCount"></span></h3>
    <div class="regions" id="regions"></div>
    <div class="foot">2015年6月、女子テニスのグラスコート大会（ロンドンとバーミンガム）を観に行った旅。</div>
  </section>
</div>

  const r=9/Math.sqrt(k);
  const sel=pinLayer.selectAll("g.pin").data(data,o=>o.i);
  sel.exit().remove();
  const en=sel.enter().append("g").attr("class","pin").attr("tabindex",0).attr("role","button").attr("aria-label",o=>o.s[0])
    .on("click",(e,o)=>{e.stopPropagation();selectSpot(o.i,true)}).on("keydown",(e,o)=>{if(e.key==="Enter")selectSpot(o.i,true)})
    .on("mousemove",(e,o)=>showTip(e,`${o.s[0]} · ${o.s[5][0]}`)).on("mouseleave",hideTip);
  const b=en.append("g").attr("class","bob").style("animation-delay",(o,j)=>`${Math.min(j*18,900)}ms`);
  b.append("circle");b.append("text").text(o=>CAT[o.s[4]].g);
  pinLayer.selectAll("g.pin").attr("transform",o=>{const[x,y]=proj([o.s[2],o.s[3]]);return `translate(${x},${y})`})
    .classed("on",o=>o.i===curSpot)
    .select("circle").attr("r",r);
  pinLayer.selectAll("g.pin text").style("font-size",`${11/Math.sqrt(k)}px`);
}
const zoom=d3.zoom().scaleExtent([1,ZMAX]).translateExtent([[0,0],[W,H]]).on("zoom",e=>{g.attr("transform",e.transform);
  const nk=e.transform.k;if(Math.abs(nk-k)>.01){k=nk;drawPins()}});
svg.call(zoom).on("dblclick.zoom",null);
document.getElementById("zin").onclick=()=>svg.transition().duration(350).call(zoom.scaleBy,1.6);
document.getElementById("zout").onclick=()=>svg.transition().duration(350).call(zoom.scaleBy,1/1.6);
document.getElementById("zreset").onclick=()=>svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity);
function flyTo(feature,scale){const[[x0,y0],[x1,y1]]=path.bounds(feature);
  const s=scale||.75/Math.max((x1-x0)/W,(y1-y0)/H);const cx=(x0+x1)/2,cy=(y0+y1)/2;
  svg.transition().duration(750).call(zoom.transform,d3.zoomIdentity.translate(W/2,H/2).scale(Math.max(1.4,Math.min(s,Math.min(ZMAX,6)))).translate(-cx,-cy))}

const tip=document.getElementById("tip"),box=document.querySelector(".mapbox");
function showTip(e,t){const r=box.getBoundingClientRect();tip.textContent=t;tip.style.left=(e.clientX-r.left)+"px";tip.style.top=(e.clientY-r.top)+"px";tip.hidden=false}
function hideTip(){tip.hidden=true}

const chips=document.getElementById("chips");
Object.entries(CAT).forEach(([c,v])=>{const n=SPOTS.filter(s=>s[4]===c).length;if(!n)return;
  const b=document.createElement("button");b.type="button";b.className="chip";b.dataset.c=c;b.id="chip-"+c;b.setAttribute("aria-pressed","true");
  b.innerHTML=`<span class="g">${v.g}</span>${v.n} ${n}`;b.onclick=()=>{b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true");drawPins()};chips.appendChild(b)});

let curPref=null,curSpot=null;
function selectPref(id,fly){
  curPref=id;const list=SPOTS.map((s,i)=>({s,i})).filter(o=>o.s[1]===id);
  const seal=document.getElementById("seal");seal.classList.remove("stamp");void seal.offsetWidth;seal.classList.add("stamp");
  const sn=PREF[id];seal.style.fontSize=(sn.length<=3?14:sn.length<=4?12:sn.length<=6?10.5:sn.length<=8?9:7.5)+"px";
  seal.innerHTML=`${sn}<small>${count(id)} TRIPS</small>`;
  document.getElementById("pSub").textContent=`${REGIONS.find(r=>r[1].includes(id))[0]} · ${list.length} スポット`;
  document.getElementById("pName").textContent=FULL[id];
  document.getElementById("pSpots").innerHTML=list.map(o=>`<li><button type="button" class="spot${o.i===curSpot?" on":""}" data-i="${o.i}">
    <span class="g">${CAT[o.s[4]].g}</span><span><b>${o.s[0]}</b> <span class="d">${o.s[5].join(" · ")}</span><p>${o.s[6]}</p></span></button></li>`).join("");
  document.querySelectorAll("#pSpots .spot").forEach(b=>b.onclick=()=>selectSpot(+b.dataset.i,true));
  prefs.classed("sel",d=>d.id===id);
  document.querySelectorAll(".st").forEach(s=>s.classList.toggle("sel",s.dataset.id===id));
  if(fly)flyTo(geo.features.find(f=>f.id===id));
}
function selectSpot(i,fly){
  curSpot=i;const s=SPOTS[i];
  if(curPref!==s[1])selectPref(s[1],false);
  document.querySelectorAll("#pSpots .spot").forEach(b=>b.classList.toggle("on",+b.dataset.i===i));
  document.querySelector(`#pSpots .spot[data-i="${i}"]`)?.scrollIntoView({block:"nearest"});
  drawPins();
  const p=proj([s[2],s[3]]);if(fly&&p){const[x,y]=p;svg.transition().duration(750).call(zoom.transform,d3.zoomIdentity.translate(W/2,H/2).scale(ZSPOT).translate(-x,-y))}
}

const regEl=document.getElementById("regions");
const stSize=n=>n.length<=3?11:n.length<=4?10:n.length<=5?9:n.length<=6?8.5:n.length<=8?8:7;
REGIONS.forEach(([name,ids])=>{const got=ids.filter(id=>count(id)).length;
  const d=document.createElement("div");d.className="reg";
  d.innerHTML=`<h4>${name}　${got}/${ids.length}</h4><div class="stamps">${ids.map((id,j)=>`<button type="button" class="st${count(id)?" got":""}" data-id="${id}" style="--r:${(j%3-1)*9-4}deg;font-size:${stSize(PREF[id])}px" ${count(id)?"":"disabled"} aria-label="${FULL[id]}${count(id)?"":"（未訪問）"}">${PREF[id]}</button>`).join("")}</div>`;
  regEl.appendChild(d)});
regEl.querySelectorAll(".st.got").forEach(b=>b.onclick=()=>{selectPref(b.dataset.id,true);document.querySelector(".mapbox").scrollIntoView({behavior:"smooth",block:"nearest"})});

const unvisited=Object.keys(PREF).filter(id=>!count(id));
document.getElementById("dice").onclick=()=>{
  const nx=document.getElementById("next");if(!unvisited.length){nx.textContent="全ての地域のスタンプが揃いました！";return}
  let n=0;const spin=setInterval(()=>{
    nx.innerHTML=`……<b>${FULL[unvisited[Math.floor(Math.random()*unvisited.length)]]}</b>`;
    if(++n>12){clearInterval(spin);const id=unvisited[Math.floor(Math.random()*unvisited.length)];
      nx.innerHTML=`次の旅先は <b>${FULL[id]}</b>！ まだ ${unvisited.length} 地域のスタンプが残っています。`;
      flyTo(geo.features.find(f=>f.id===id));prefs.classed("sel",d=>d.id===id)}},70)};

drawPins();
selectPref("a15",false);

</script>

</body></html>
